name: CI_build

on: [push, pull_request]

jobs:
  build:

    runs-on: windows-latest
    env:
      Projectname: NppFoldTail
    strategy:
      fail-fast: false
      matrix:
        include:
          - msys: UCRT64
            env: ucrt-x86_64
            arch: x86_64
            configuration: Release
            compiler: gcc
          - msys: MINGW32
            env: i686
            arch: i686
            configuration: Release
            compiler: gcc

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Install and update MSYS2 tools
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msys }}
        install: mingw-w64-${{ matrix.env }}-${{ matrix.compiler }}
        update: true
        release: true

    - name: Build of plugin dll
      working-directory: .\
      env:
        MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
      run: |
           Write-host "${{ matrix.msys }}"
           Write-host "${{ matrix.configuration }}"
           $Env:MSYSTEM = '${{ matrix.msys }}'
           $tools = Join-Path $Env:MSYS2_ROOT ('${{ matrix.msys }}'.ToLower() + '\bin')
           $usr = Join-Path $Env:MSYS2_ROOT 'usr\bin'
           $Env:Path = $tools + [IO.Path]::PathSeparator + $usr + [IO.Path]::PathSeparator + $Env:Path
           Write-Output "Tools version:"
           Write-Output ((g++ --version | Select-Object -First 1) + " " + (g++ -dumpmachine))
           Write-Output (Get-Command g++).Source
           if ('${{ matrix.arch }}' -eq 'i686') { .\build-x32.bat } else { .\build-x64.bat }
           if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: zip artifacts for ${{ matrix.msys }} / ${{ matrix.configuration }}
      run: |
           $header = Get-Content src/version.h -Raw
           if ($header -notmatch '#define NPPFOLDTAIL_VERSION "([0-9]+\.[0-9]+\.[0-9]+)"') {
             throw 'Could not read the plugin version.'
           }
           $version = $Matches[1]
           $arch = if ('${{ matrix.arch }}' -eq 'i686') { 'x86' } else { 'x64' }
           $zipName = "${{ env.Projectname }}-$version-$arch.zip"
           $zipPath = Join-Path $PWD $zipName
           Add-Type -AssemblyName System.IO.Compression.FileSystem
           $zip = [IO.Compression.ZipFile]::Open($zipPath, [IO.Compression.ZipArchiveMode]::Create)
           try {
             [IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, (Join-Path $PWD 'build/NppFoldTail.dll'), 'NppFoldTail.dll') | Out-Null
           } finally {
             $zip.Dispose()
           }
           "RELEASE_ZIP=$zipName" >> $Env:GITHUB_ENV
           Get-FileHash $zipPath -Algorithm SHA256

    - name: Archive artifacts for Release ${{ matrix.arch }}
      uses: actions/upload-artifact@v7
      with:
        name: NppFoldTail-${{ matrix.arch }}-${{ matrix.configuration }}
        path: ${{ env.RELEASE_ZIP }}
        if-no-files-found: error
        archive: false
